name: Android APK

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build signed arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK, build tools and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "platforms;android-24" "build-tools;35.0.0" "ndk;28.0.13004108"

      - name: Build ProtoGrid-core from sing-box v1.14.4 + patches
        run: |
          git clone --depth 1 --branch v1.14.4 https://github.com/SagerNet/sing-box.git forks/sing-box
          cd forks/sing-box
          git config user.name "ProtoGrid CI"
          git config user.email "ci@protogrid.local"
          git am ../../docs/patches/*.patch

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
          cache-dependency-path: forks/sing-box/go.sum

      - name: Cache libbox
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: forks/sing-box/libbox.aar
          key: libbox-arm64-${{ hashFiles('docs/patches/*.patch') }}

      - name: Build libbox for arm64
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        working-directory: forks/sing-box
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/28.0.13004108"
          export CGO_LDFLAGS_ALLOW='-l:.*'
          make lib_install
          go run ./cmd/internal/build_libbox -target android -platform android/arm64
          ls -lh libbox.aar

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build Rust JNI bridge
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/28.0.13004108"
          cargo ndk -t arm64-v8a -o apps/protogrid-android/app/src/main/jniLibs \
            build -p protogrid-mobile --release
          ls -lh apps/protogrid-android/app/src/main/jniLibs/arm64-v8a

      - name: Stage libbox
        run: |
          mkdir -p apps/protogrid-android/app/libs
          cp forks/sing-box/libbox.aar apps/protogrid-android/app/libs/libbox.aar

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PROTOGRID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > apps/protogrid-android/app/release.keystore
          elif [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            echo "::error::Set PROTOGRID_KEYSTORE_BASE64 before tagging an Android release"
            exit 1
          else
            echo "::warning::PROTOGRID_KEYSTORE_BASE64 is not set; using the debug key"
          fi

      - name: Build release APK
        working-directory: apps/protogrid-android
        env:
          PROTOGRID_KEYSTORE_PASSWORD: ${{ secrets.PROTOGRID_KEYSTORE_PASSWORD }}
          PROTOGRID_KEY_ALIAS: ${{ secrets.PROTOGRID_KEY_ALIAS }}
          PROTOGRID_KEY_PASSWORD: ${{ secrets.PROTOGRID_KEY_PASSWORD }}
        run: |
          if [ -f app/release.keystore ]; then
            export PROTOGRID_KEYSTORE="$PWD/app/release.keystore"
          fi
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Collect APK
        run: |
          SOURCE=$(find apps/protogrid-android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$SOURCE"
          cp "$SOURCE" "ProtoGrid-${VERSION_NAME}-arm64-v8a.apk"
          ls -lh ProtoGrid-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ProtoGrid-APK
          path: ProtoGrid-*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ProtoGrid-*.apk
          generate_release_notes: true

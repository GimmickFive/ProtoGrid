name: Android APK

on:
  push:
    tags:
      # Desktop releases and Android-only releases both carry APKs. `v*` does
      # not match `android-v*`, so both patterns are required.
      - "v*"
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build signed arm64 APKs
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK, build tools and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "platforms;android-24" "build-tools;35.0.0" "ndk;28.0.13004108"

      - name: Build ProtoGrid-core from sing-box v1.14.4 + patches
        run: |
          git clone --depth 1 --branch v1.14.4 https://github.com/SagerNet/sing-box.git forks/sing-box
          cd forks/sing-box
          git config user.name "ProtoGrid CI"
          git config user.email "ci@protogrid.local"
          git am ../../docs/patches/*.patch

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
          cache-dependency-path: forks/sing-box/go.sum

      - name: Cache libbox
        uses: actions/cache@v4
        with:
          path: |
            forks/sing-box/libbox.aar
            forks/sing-box/libbox-lite.aar
          key: libbox-arm64-${{ hashFiles('docs/patches/*.patch') }}

      - name: Check cached libbox
        id: libbox
        run: |
          has_abi() {
            [ -f "$1" ] && jar tf "$1" | grep -x "jni/arm64-v8a/libbox.so" >/dev/null
          }
          if has_abi forks/sing-box/libbox.aar && has_abi forks/sing-box/libbox-lite.aar; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build libbox for arm64
        if: steps.libbox.outputs.ready != 'true'
        working-directory: forks/sing-box
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/28.0.13004108"
          export CGO_LDFLAGS_ALLOW='-l:.*'
          make lib_install
          go run ./cmd/internal/build_libbox -target android -platform android/arm64 \
            -output libbox.aar
          go run ./cmd/internal/build_libbox -target android -platform android/arm64 \
            -tags "protogrid_lite,with_utls,with_clash_api,with_gvisor" \
            -output libbox-lite.aar -legacy=false
          for aar in libbox.aar libbox-lite.aar; do
            jar tf "$aar" | grep -x "jni/arm64-v8a/libbox.so" >/dev/null || {
              echo "::error::$aar does not contain jni/arm64-v8a/libbox.so"
              exit 1
            }
          done
          ls -lh libbox.aar libbox-lite.aar

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build Rust JNI bridge
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/28.0.13004108"
          cargo ndk -t arm64-v8a -o apps/protogrid-android/app/src/main/jniLibs \
            build -p protogrid-mobile --release
          ls -lh apps/protogrid-android/app/src/main/jniLibs/arm64-v8a

      - name: Stage libbox
        run: |
          mkdir -p apps/protogrid-android/app/libs
          cp forks/sing-box/libbox.aar apps/protogrid-android/app/libs/libbox.aar
          cp forks/sing-box/libbox-lite.aar apps/protogrid-android/app/libs/libbox-lite.aar
          for aar in apps/protogrid-android/app/libs/libbox.aar \
                     apps/protogrid-android/app/libs/libbox-lite.aar; do
            jar tf "$aar" | grep -x "jni/arm64-v8a/libbox.so" >/dev/null || {
              echo "::error::$aar does not contain jni/arm64-v8a/libbox.so"
              exit 1
            }
          done

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/tags/android-v* ]]; then
            TAG="${GITHUB_REF_NAME#android-v}"
            echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PROTOGRID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > apps/protogrid-android/app/release.keystore
          elif [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/tags/android-v* ]]; then
            echo "::error::Set PROTOGRID_KEYSTORE_BASE64 before tagging a release"
            exit 1
          else
            echo "::warning::PROTOGRID_KEYSTORE_BASE64 is not set; using the debug key"
          fi

      - name: Decode legacy signing material
        if: startsWith(github.ref, 'refs/tags/')
        env:
          LEGACY_KEYSTORE_BASE64: ${{ secrets.PROTOGRID_LEGACY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$LEGACY_KEYSTORE_BASE64" ]; then
            echo "::error::Set PROTOGRID_LEGACY_KEYSTORE_BASE64 before tagging a release"
            exit 1
          fi
          echo "$LEGACY_KEYSTORE_BASE64" | base64 -d > apps/protogrid-android/app/legacy.keystore
          test -s apps/protogrid-android/signing/lineage.bin || {
            echo "::error::apps/protogrid-android/signing/lineage.bin is missing"
            exit 1
          }

      - name: Build release APKs
        working-directory: apps/protogrid-android
        env:
          PROTOGRID_KEYSTORE_PASSWORD: ${{ secrets.PROTOGRID_KEYSTORE_PASSWORD }}
          PROTOGRID_KEY_ALIAS: ${{ secrets.PROTOGRID_KEY_ALIAS }}
          PROTOGRID_KEY_PASSWORD: ${{ secrets.PROTOGRID_KEY_PASSWORD }}
        run: |
          if [ -f app/release.keystore ]; then
            : "${PROTOGRID_KEYSTORE_PASSWORD:?PROTOGRID_KEYSTORE_PASSWORD is required}"
            : "${PROTOGRID_KEY_ALIAS:?PROTOGRID_KEY_ALIAS is required}"
            : "${PROTOGRID_KEY_PASSWORD:?PROTOGRID_KEY_PASSWORD is required}"
            export PROTOGRID_KEYSTORE="$PWD/app/release.keystore"
            export PROTOGRID_REQUIRE_RELEASE_KEY=1
          fi
          chmod +x gradlew
          ./gradlew :app:assembleStandardRelease :app:assembleLiteRelease --no-daemon

      - name: Collect APKs
        run: |
          STANDARD=$(find apps/protogrid-android/app/build/outputs/apk/standard/release -name "*.apk" | head -n 1)
          LITE=$(find apps/protogrid-android/app/build/outputs/apk/lite/release -name "*.apk" | head -n 1)
          test -n "$STANDARD"
          test -n "$LITE"
          cp "$STANDARD" "ProtoGrid-${VERSION_NAME}-arm64-v8a.apk"
          cp "$LITE" "ProtoGrid-${VERSION_NAME}-lite-arm64-v8a.apk"
          ls -lh ProtoGrid-*.apk

      # v1/v2 must stay on the legacy key for Android 8.x, while v3 carries the
      # new release key plus the proof-of-rotation. This keeps in-place updates
      # working for everyone who installed 0.4.1 and earlier.
      - name: Add key rotation lineage to APKs
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PROTOGRID_KEYSTORE_PASSWORD: ${{ secrets.PROTOGRID_KEYSTORE_PASSWORD }}
          PROTOGRID_KEY_PASSWORD: ${{ secrets.PROTOGRID_KEY_PASSWORD }}
          PROTOGRID_KEY_ALIAS: ${{ secrets.PROTOGRID_KEY_ALIAS }}
          PROTOGRID_LEGACY_KEYSTORE_PASSWORD: ${{ secrets.PROTOGRID_LEGACY_KEYSTORE_PASSWORD }}
          PROTOGRID_LEGACY_KEY_PASSWORD: ${{ secrets.PROTOGRID_LEGACY_KEY_PASSWORD }}
          PROTOGRID_LEGACY_KEY_ALIAS: ${{ secrets.PROTOGRID_LEGACY_KEY_ALIAS }}
        run: |
          APKSIGNER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          for apk in ProtoGrid-*.apk; do
            "$APKSIGNER" sign \
              --ks apps/protogrid-android/app/legacy.keystore \
              --ks-pass "pass:${PROTOGRID_LEGACY_KEYSTORE_PASSWORD}" \
              --key-pass "pass:${PROTOGRID_LEGACY_KEY_PASSWORD}" \
              --ks-key-alias "${PROTOGRID_LEGACY_KEY_ALIAS}" \
              --next-signer \
              --ks apps/protogrid-android/app/release.keystore \
              --ks-pass "pass:${PROTOGRID_KEYSTORE_PASSWORD}" \
              --key-pass "pass:${PROTOGRID_KEY_PASSWORD}" \
              --ks-key-alias "${PROTOGRID_KEY_ALIAS}" \
              --lineage apps/protogrid-android/signing/lineage.bin \
              --rotation-min-sdk-version 28 \
              --out "$apk.rotated" "$apk"
            mv "$apk.rotated" "$apk"
          done

      # The debug key is fine for a local build or a manual test run, but a
      # published release must use the stable release certificate. Otherwise
      # a later debug key would make in-place updates impossible.
      - name: Verify release APK signatures
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APKSIGNER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          for apk in ProtoGrid-*.apk; do
            "$APKSIGNER" verify "$apk"
            "$APKSIGNER" lineage --in "$apk" --print-certs >/dev/null
            cert=$("$APKSIGNER" verify --print-certs "$apk" |
              sed -n 's/^Signer #1 certificate DN: //p')
            echo "$apk: $cert"
            if echo "$cert" | grep -qi "CN=Android Debug"; then
              echo "::error::$apk is signed with the Android debug certificate"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ProtoGrid-APK
          path: ProtoGrid-*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Attach to the existing `vX.Y.Z` release when it was created by the
          # desktop release step; create an `android-vX.Y.Z` release otherwise.
          tag_name: ${{ github.ref_name }}
          files: ProtoGrid-*.apk
          fail_on_unmatched_files: true
          # `vX.Y.Z` already carries hand-written CHANGELOG notes; only the
          # Android-only tag gets generated notes.
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/android-v') }}

[package]
name = "protogrid-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native ProtoGrid desktop client (egui, no WebView)"
default-run = "protogrid"

[[bin]]
name = "protogrid"
path = "src/main.rs"

[dependencies]
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
    "links",
    "persistence",
] }
egui = "0.36"
egui-phosphor = "0.14"
flate2 = "1"
protogrid-core = { path = "../../crates/protogrid-core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.40", default-features = false, features = ["network"] }
tar = "0.4"
tray-icon = "0.25"
tokio = { version = "1", features = [
    "process",
    "io-util",
    "time",
    "net",
    "rt-multi-thread",
    "macros",
    "sync",
    "fs",
] }
uuid = { version = "1", features = ["v4"] }
zip = "2"
rfd = { version = "0.14.0", default-features = false, features = ["gtk3"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
